name: Build & Release

# Runs on every push. Auto-publishes a GitHub Release only when
# version.properties changes on main (that's your single version-management file).
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read version.properties
        id: version
        run: |
          name=$(grep VERSION_NAME version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          code=$(grep VERSION_CODE version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Building version $name ($code)"

      # Decode the signing keystore from a repo secret, if one has been added.
      # Repo secret required: KEYSTORE_BASE64 (base64 of your .jks/.keystore file)
      # Plus: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shelf-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shelf-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Only auto-release from main, and only when version.properties actually
      # changed in this push (so pushing unrelated commits doesn't spam releases).
      - name: Check if version.properties changed
        id: check_release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx "version.properties"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: shelf-release-apk
          path: dist

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          tag="v$VERSION"
          mv dist/*.apk "dist/Shelf-$VERSION.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi
          gh release create "$tag" "dist/Shelf-$VERSION.apk" \
            --title "Shelf $VERSION" \
            --generate-notes
